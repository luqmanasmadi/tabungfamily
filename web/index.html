<div id="app"><div class="loading">…</div></div>

<script>
'use strict';
/* =====================================================================
   TabungFamily — public dashboard + admin (single file)
   ===================================================================== */
const DEMO = !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY;
const SUPABASE_JS = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';
const XLSX_JS = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
/* Spending categories: fixed slug, BM / EN label, fixed colour (categorical palette, never re-ordered).
   "lain" is the neutral "other" bucket. The bot's /out command and the import use the same slugs. */
const CAT = [
  ['kereta', 'Kereta', 'Car', '#2a78d6'], ['rumah', 'Rumah', 'House', '#eb6834'], ['melancong', 'Melancong', 'Travel', '#1baf7a'],
  ['kampung', 'Balik kampung', 'Hometown trips', '#eda100'], ['kenduri', 'Kenduri', 'Kenduri / feasts', '#e87ba4'],
  ['perubatan', 'Perubatan', 'Medical', '#008300'], ['raya', 'Raya', 'Raya', '#6250d6'], ['kecemasan', 'Kecemasan', 'Emergency', '#e34948'],
  ['lain', 'Lain-lain', 'Other', '#8b8d98'],
];
const CAT_SYN = { 'kereta estima': 'kereta', car: 'kereta', kenderaan: 'kereta', house: 'rumah', travel: 'melancong', percutian: 'melancong', holiday: 'melancong',
  'balik kampung': 'kampung', 'balik kg': 'kampung', hometown: 'kampung', majlis: 'kenduri', medical: 'perubatan', ubat: 'perubatan', hospital: 'perubatan',
  emergency: 'kecemasan', bantuan: 'kecemasan', 'lain-lain': 'lain', other: 'lain', others: 'lain' };
/** Any category text -> one of the fixed slugs ("lain" if unknown). */
function catSlug(x) {
  const v = String(x ?? '').trim().toLowerCase();
  return CAT.some((c) => c[0] === v) ? v : CAT_SYN[v] || 'lain';
}
const catInfo = (x) => CAT.find((c) => c[0] === catSlug(x));

async function fetchAll(q) {
  const out = []; let from = 0;
  for (;;) {
    const { data, error } = await q().range(from, from + 999);
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) return out;
    from += 1000;
  }
}

/* ------------------------------------------------------------------ money rules (spec §4) */
function brks(memberId, extra = []) {
  return S.breaks.filter((b) => b.member_id === memberId).concat(extra)
    .map((b) => [mi(b.from_month), b.to_month ? mi(b.to_month) : Infinity]);
}
/** Month indexes a member owes, ascending, from start_month up to `upto`, skipping breaks. */
function dueList(m, upto, extra) {
  const s = mi(m.start_month), br = brks(m.id, extra), out = [];
  for (let i = s; i <= upto; i++) if (!br.some(([a, z]) => i >= a && i <= z)) out.push(i);
  return out;
}
const inBreak = (m, i) => brks(m.id).some(([a, z]) => i >= a && i <= z);
const openBreak = (m) => S.breaks.find((b) => b.member_id === m.id && !b.to_month);
const isFee = (p) => p.kind !== 'sumbangan';
/** Monthly fees a member has paid (sumbangan does not pay dues). */
function paidBy(id, upto) { return approvedIn().filter((p) => p.member_id === id && isFee(p) && (!upto || p.paid_on <= upto)).reduce((s, p) => s + p.amount, 0); }
/**
 * How much of each owed month is covered, and when it was paid.
 * Fees tagged with for_month go to that month; the rest (and anything above the fee) fills the
 * oldest owed month first (FIFO). Same rule as the Google Sheet backup.
 */
function coverage(m, list) {
  const f = fee(), cov = {}, dates = {}, refs = {}, inList = new Set(list);
  const add = (i, amt, d, ref) => {
    cov[i] = (cov[i] || 0) + amt; (dates[i] = dates[i] || []).includes(d) || dates[i].push(d);
    if (ref) (refs[i] = refs[i] || []).includes(ref) || refs[i].push(ref);
  };
  const pays = approvedIn().filter((p) => p.member_id === m.id && isFee(p)).sort((a, b) => (a.paid_on < b.paid_on ? -1 : a.paid_on > b.paid_on ? 1 : a.id - b.id));
  const pool = [];
  pays.forEach((p) => {
    const i = p.for_month ? mi(p.for_month) : null;
    if (i !== null && inList.has(i)) {
      const put = Math.min(Math.max(0, f - (cov[i] || 0)), p.amount);
      if (put > 0) add(i, put, p.paid_on, p.ref);
      if (p.amount - put > 0.005) pool.push({ amt: p.amount - put, d: p.paid_on, ref: p.ref });
    } else pool.push({ amt: p.amount, d: p.paid_on, ref: p.ref });
  });
  let k = 0;
  for (const x of pool) {
    let left = x.amt;
    while (left > 0.005 && k < list.length) {
      const i = list[k], room = f - (cov[i] || 0);
      if (room <= 0.005) { k++; continue; }
      const put = Math.min(room, left);
      add(i, put, x.d, x.ref); left -= put;
    }
  }
  return { cov, dates, refs };
}
/** Member standing at month index `idx` counting payments up to date `upto` (default: all). */
function standingAt(m, idx = NOW(), upto) {
  const due = dueList(m, idx), paid = paidBy(m.id, upto), owed = due.length * fee();
  const ob = openBreak(m);
  const stopped = !!ob && mi(ob.from_month) <= idx;
  return { paid, owed, owe: Math.max(0, r2(owed - paid)), months: Math.ceil(Math.max(0, owed - paid) / fee() - 1e-9), stopped, lastMonth: ob ? mi(ob.from_month) - 1 : null, active: !stopped && mi(m.start_month) <= idx };
}
/** Grid status of member m in month i (FIFO: payments fill oldest owed month first). */
function monthStatus(m, i, c) {
  if (i < mi(m.start_month) || inBreak(m, i)) return 'none';
  const covered = c.cov[i] || 0;
  if (covered >= fee() - 0.005) return 'paid';
  if (covered > 0.005) return 'part';
  return i <= NOW() ? 'unpaid' : 'up';
}
/** Last month a member is fully covered for (FIFO), or start-1 if none. */
function lastFullyPaid(m) {
  const list = dueList(m, NOW() + 240), n = Math.floor((paidBy(m.id) + 0.005) / fee());
  return n > 0 ? list[Math.min(n, list.length) - 1] : mi(m.start_month) - 1;
}
function fundYear(y) {
  const open = Number(S.settings.opening_balance) || 0, a = `${y}-01-01`, z = `${y}-12-31`;
  const ins = approvedIn(), outs = S.cashOut;
  const sum = (arr, f) => arr.filter(f).reduce((s, x) => s + x.amount, 0);
  const bf = open + sum(ins, (p) => p.paid_on < a) - sum(outs, (o) => o.spent_on < a);
  const yin = sum(ins, (p) => p.paid_on >= a && p.paid_on <= z), yout = sum(outs, (o) => o.spent_on >= a && o.spent_on <= z);
  const cur = open + sum(ins, () => true) - sum(outs, () => true);
  return { bf, yin, yout, close: bf + yin - yout, cur };
}
function years() {
  const ys = new Set([curYear()]);
  approvedIn().forEach((p) => ys.add(Number(p.paid_on.slice(0, 4))));
  S.cashOut.forEach((o) => ys.add(Number(o.spent_on.slice(0, 4))));
  S.members.forEach((m) => ys.add(Number(m.start_month.slice(0, 4))));
  const arr = [...ys].filter((y) => y <= curYear()).sort();
  const out = []; for (let y = arr[0]; y <= curYear(); y++) out.push(y);
  return out;
}

const HEAD = {
  tarikh: ['tarikh', 'date', 'paid_on', 'spent_on', 'tarikhbayar'], ahli: ['ahli', 'nama', 'member', 'name', 'membername'],
  jenis: ['jenis', 'type'], jumlah: ['jumlah', 'amount', 'amaun', 'rm'], keterangan: ['keterangan', 'description', 'note', 'nota', 'catatan', 'perkara'],

const normH = (s) => String(s ?? '').toLowerCase().replace(/[\s_.\-()]/g, '');
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; continue; }
    if (c === '"') q = true; else if (c === ',' || c === ';' || c === '\t') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;

  if (f !== '' || row.length) { row.push(f); rows.push(row); }

}
function parseDate(v) {
  if (v instanceof Date && !isNaN(v)) { const d = new Date(v.getTime() + 12 * 3600e3); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
  if (typeof v === 'number' && v > 20000 && v < 80000) return new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 864e5).toISOString().slice(0, 10);
  const s = String(v ?? '').trim(); let y, m, d, x;
  if ((x = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) [, y, m, d] = x;
  else if ((x = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/))) [, d, m, y] = x;
  else if (/^\d{5}(\.\d+)?$/.test(s)) return parseDate(Number(s));
  else return null;
  const dt = new Date(Date.UTC(+y, +m - 1, +d));

/** "2024-03", "03/2024", "Mac 2024" or a date -> "YYYY-MM-01" (null if empty / unreadable). */

  if ((x = s.match(/^(\d{1,2})[\/\-](\d{4})$/))) return `${x[2]}-${pad(x[1])}-01`;
  const names = [MON.bm, MON.en].map((a) => a.map((n) => n.toLowerCase()));
  if ((x = s.toLowerCase().match(/^([a-z]{3})[a-z]*\.?\s+(\d{4})$/))) {
    const k = names.map((a) => a.indexOf(x[1])).find((k) => k >= 0);
    if (k !== undefined) return `${x[2]}-${pad(k + 1)}-01`;

async function readImportFile(file) {

  else {
    await loadScript(XLSX_JS);
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
    grid = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' });
  }
  grid = grid.filter((r) => r.some((c) => String(c ?? '').trim() !== ''));
  if (!grid.length) return { name: file.name, rows: [] };
  const head = grid[0].map(normH), col = {};
  for (const [k, syn] of Object.entries(HEAD)) { const i = head.findIndex((x) => syn.includes(x)); if (i >= 0) col[k] = i; }
  const get = (r, k) => (col[k] === undefined ? '' : r[col[k]]);
  const raw = [];
  grid.slice(1).forEach((r, n) => {
    const st = String(get(r, 'status')).trim().toLowerCase();
    if (col.status !== undefined && st && st !== 'approved') return; // skip pending / rejected
    raw.push({ n: n + 2, date: parseDate(get(r, 'tarikh')), member: String(get(r, 'ahli')).trim(), jenis: String(get(r, 'jenis')).trim().toLowerCase(),
      amount: parseAmount(get(r, 'jumlah')), desc: String(get(r, 'keterangan')).trim(), cat: String(get(r, 'kategori')).trim().toLowerCase(),
      ref: String(get(r, 'rujukan')).trim(), receipt: String(get(r, 'resit')).trim(), cara: String(get(r, 'cara')).trim().toLowerCase(),
      catRaw: String(get(r, 'kategori')).trim(), forMonth: parseMonth(get(r, 'untuk')) });

}
function markImport(imp) {

      seenIn.add(k);
    } else {
      const k = `${r.date}|${r.amount}|${(r.desc || r.cat || '').toLowerCase()}`;
      r.mark = seenOut.has(k) ? 'dup' : isUrl(r.receipt) ? 'ok' : 'legacy';
      seenOut.add(k);
    }
  });
  imp.counts = { ok: 0, dup: 0, legacy: 0, nomem: 0, bad: 0 };
  imp.rows.forEach((r) => imp.counts[r.mark]++);
}
const importable = (imp) => imp.rows.filter((r) => r.mark === 'ok' || r.mark === 'legacy' || (r.mark === 'dup' && !imp.skipDup) || (r.mark === 'nomem' && imp.create));
function renderImport(imp) {
  if (UI.impDone) return `<div class="banner" style="margin-top:14px" role="status">${t('impDone', UI.impDone.n)}
      <a class="btn sm" href="#" data-act="seeYear" data-v="${UI.impDone.year}">${t('seeDash', UI.impDone.year)}</a>
      <button type="button" class="btn sm" data-act="impAgain">${t('impAgain')}</button></div>`;
  const step = imp ? 3 : 1;
  const MK = { ok: ['mark-ok', t('mOk')], dup: ['mark-w', t('mDup')], legacy: ['mark-w', t('mLegacy')], nomem: ['mark-x', t('mNoMem')], bad: ['mark-x', t('mBad')] };
  let html = `<div class="steps">
    <div class="step ${step === 1 ? 'on' : ''}"><div class="n">1</div><b>${t('impS1')}</b><p class="small muted" style="margin:4px 0 10px">${t('impS1d')}</p><button type="button" class="btn sm" data-act="tpl">⬇ ${t('dlTpl')}</button></div>
    <div class="step ${step === 1 ? 'on' : ''}"><div class="n">2</div><b>${t('impS2')}</b><p class="small muted" style="margin:4px 0 10px">${t('impS2d')}</p>
      <label class="btn sm" style="position:relative">${t('chooseFile')}<input type="file" id="impFile" accept=".xlsx,.xls,.csv" style="position:absolute;inset:0;opacity:0;cursor:pointer" aria-label="${t('impS2')}"></label></div>
    <div class="step ${step === 3 ? 'on' : ''}"><div class="n">3</div><b>${t('impS3')}</b><p class="small muted" style="margin:4px 0 0">${t('impS3d')}</p></div></div>`;
  if (!imp) return html;
  if (!imp.rows.length) return html + `<p class="err">${h(imp.name)}: ${t('noRows')}</p>`;
  const n = importable(imp).length;
  html += `<div style="margin-top:16px"><b>📄 ${h(imp.name)}</b> · <span class="muted">${t('rows', imp.rows.length)}</span>
    <div class="counts">${Object.entries(imp.counts).filter(([, v]) => v).map(([k, v]) => `<span class="tag ${k === 'ok' ? 'ok' : k === 'bad' || k === 'nomem' ? 'grey' : 'warn'}">${MK[k][1]}: ${v}</span>`).join('')}</div>
    <div class="scroll" style="max-height:340px;overflow-y:auto"><table><thead><tr><th>#</th><th>${t('date')}</th><th>${t('member')}</th><th>${t('type')}</th><th class="r">${t('amount')}</th><th>${t('desc')}</th><th>${t('mark')}</th></tr></thead><tbody>
    ${imp.rows.map((r) => `<tr><td class="muted">${r.n}</td><td class="num">${r.date ? fmtDate(r.date) : '<span class="mark-x">?</span>'}</td><td>${h(r.member || '—')}</td>
      <td>${r.type === 'in' ? t('in') : r.type === 'out' ? t('out') : '?'}</td><td class="r num">${r.amount ? rm(r.amount) : '<span class="mark-x">?</span>'}</td>
      <td style="min-width:140px">${h(r.desc || r.cat || '')}</td><td class="${MK[r.mark][0]}" style="white-space:nowrap">${MK[r.mark][1]}${r.mark === 'nomem' && imp.create ? ` · ${t('willCreate')}` : ''}</td></tr>`).join('')}
    </tbody></table></div>
    <label class="chk"><input type="checkbox" data-act="impOpt" data-v="create" ${imp.create ? 'checked' : ''}> ${t('createMem')}</label>
    <label class="chk"><input type="checkbox" data-act="impOpt" data-v="skipDup" ${imp.skipDup ? 'checked' : ''}> ${t('skipDup')}</label>
    <label class="f" for="impOpen">${t('openBal')}</label><input class="in-f" id="impOpen" type="number" step="0.01" value="${h(imp.open)}" style="max-width:240px">
    <div class="acts"><button type="button" class="btn pri" data-act="doImport" ${n && !UI.busy.imp ? '' : 'disabled'}>${UI.busy.imp ? t('importing') : t('doImport', n)}</button>
      <button type="button" class="btn" data-act="impAgain">${t('cancel')}</button></div></div>`;
  return html;
}
function templateCSV() {
  return 'tarikh,ahli,jenis,jumlah,keterangan,kategori,rujukan,untuk_bulan\n' +
    '05/07/2025,Abah,masuk,100,Yuran Julai,yuran,DN2507050001,2025-07\n' +
    '6/7/2025,Mak,masuk,RM100.00,Yuran Julai,yuran,,2025-07\n' +
    '2025-08-05,Abah,in,200,Yuran Ogos & Sep (kosongkan untuk_bulan = isi bulan tertunggak dulu),yuran,,\n' +
    '01/09/2025,Lain-lain,masuk,54,Duit pecah tabung,sumbangan,,\n' +
    '22/08/2025,,keluar,"1,000",Kenduri kahwin Angah,kenduri,,\n' +
    '18-12-2025,,out,RM 500,Bantuan banjir rumah Mak Long,kecemasan,,\n';
}
async function doImport() {
  const imp = UI.imp, rows = importable(imp);
  UI.busy.imp = true; render();
  try {
    const open = imp.open === '' ? null : Number(imp.open);
    if (open !== null && isFinite(open) && String(open) !== String(Number(S.settings.opening_balance || 0))) await api.settings({ opening_balance: open });
    // 1) members
    const newNames = new Map();
    rows.filter((r) => r.type === 'in' && !r.m && !r.other).forEach((r) => {
      // start month = first monthly fee; a member with only contributions starts at their first one
      const k = r.member.toLowerCase(), fee1 = r.kind === 'yuran', first = fee1 && r.forMonth ? r.forMonth : r.date, cur = newNames.get(k);
      if (!cur || (fee1 && !cur.fee) || (fee1 === cur.fee && first < cur.date)) newNames.set(k, { name: r.member, date: first, fee: fee1 });
    });
    if (newNames.size) {
      const made = await api.insert('members', [...newNames.values()].map((x) => ({ name: x.name, start_month: x.date.slice(0, 8) + '01' })));
      made.forEach((m) => rows.forEach((r) => { if (r.type === 'in' && r.member.toLowerCase() === m.name.toLowerCase()) r.m = m; }));
    }
    // 2) cash in
    const ins = rows.filter((r) => r.type === 'in' && (r.m || r.other)).map((r) => ({ member_id: r.m ? r.m.id : null, paid_on: r.date, amount: r.amount, method: /tunai|cash/.test(r.cara) ? 'cash' : 'transfer',
      ref: r.ref || null, sent_by: r.m ? r.m.id : null, source: 'import', status: 'approved', note: r.desc || null, kind: r.kind, for_month: r.kind === 'yuran' ? r.forMonth : null }));
    if (ins.length) await api.insert('cash_in', ins);
    // 3) cash out
    const outs = rows.filter((r) => r.type === 'out').map((r) => ({ spent_on: r.date, description: r.desc || r.cat || 'Rekod lama', category: catSlug(r.catRaw),
      amount: r.amount, receipt_url: isUrl(r.receipt) ? r.receipt : null, legacy: !isUrl(r.receipt), source: 'import' }));
    if (outs.length) await api.insert('cash_out', outs);
    const yrs = rows.map((r) => Number(r.date.slice(0, 4)));
    UI.impDone = { n: ins.length + outs.length, year: Math.max(...yrs) };
    UI.imp = null;
    await loadData();
  } catch (e) { toast(t('error', e.message || e), 6000); }
  UI.busy.imp = false; render();
}

/* ------------------------------------------------------------------ stop dialog */
function openStop(m) {
  const dlg = $('#dlg'), def = lastFullyPaid(m), nowOwe = standingAt(m).owe;
  const minV = miDate(mi(m.start_month) - 1).slice(0, 7);
  dlg.innerHTML = `<form class="card" method="dialog" id="fStop">
    <p class="eyebrow">${t('stopBtn')}</p><h2>${t('stopT', h(m.name))}</h2>
    <label class="f" for="stM">${t('lastMonth')}</label><input class="in-f" id="stM" type="month" min="${minV}" value="${miDate(def).slice(0, 7)}" required>
    <label class="f" for="stR">${t('reason')}</label><input class="in-f" id="stR" maxlength="120">
    <p class="info">ℹ️ ${t('stopInfo')}</p>
    <div class="cmp"><div><span class="small muted">${t('oweNow')}</span><b class="num" style="color:var(--due-fg)">${rm(nowOwe)}</b></div>
      <div><span class="small muted">${t('oweAfter')}</span><b class="num" id="stAfter">—</b></div></div>
    <div class="acts" style="justify-content:flex-end"><button type="button" class="btn" data-act="dlgClose">${t('cancel')}</button><button type="submit" class="btn pri">${t('confirmStop')}</button></div></form>`;
  const calc = () => {
    const v = $('#stM').value; if (!v) return;
    const last = mi(v + '-01'), extra = [{ member_id: m.id, from_month: miDate(last + 1), to_month: null }];
    const owed = dueList(m, NOW(), extra).length * fee();
    $('#stAfter').textContent = rm(Math.max(0, owed - paidBy(m.id)));
  };
  $('#stM').addEventListener('input', calc); calc();
  $('#fStop').addEventListener('submit', async (e) => {
    e.preventDefault();
    const v = $('#stM').value; if (!v) return;
    try {
      await api.insert('member_breaks', { member_id: m.id, from_month: miDate(mi(v + '-01') + 1), to_month: null, reason: $('#stR').value.trim() || null });
      dlg.close(); await refresh();
    } catch (err) { toast(t('error', err.message || err), 6000); }
  });
  dlg.showModal();
}

/* ------------------------------------------------------------------ actions */
async function refresh() { try { await loadData(); } catch (e) { toast(t('loadErr', e.message || e), 6000); } render(); }
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const fileB64 = (file) => new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = bad; r.readAsDataURL(file); });

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'INPUT') return;
  const act = el.dataset.act, v = el.dataset.v;
  if (act === 'lang') { lang = v; try { localStorage.setItem('tf_lang', v); } catch (_) { /* ignore */ } render(); }
  else if (act === 'year') { UI.year = Number(v); render(); }
  else if (act === 'demoReceipt') toast('Demo: resit disimpan di Google Drive dalam sistem sebenar.');
  else if (act === 'logout') { if (sb) await sb.auth.signOut(); UI.adminOk = false; await refresh(); }
  else if (act === 'addTab') { UI.addTab = v; render(); }
  else if (act === 'decide') {
    const card = el.closest('[data-batch]'), batch_id = card.dataset.batch, amounts = {};
    card.querySelectorAll('input[data-row]').forEach((i) => { if (Number(i.value) > 0) amounts[i.dataset.row] = Number(i.value); });
    card.querySelectorAll('button').forEach((b) => (b.disabled = true));
    try { await edge(v, { batch_id, amounts }); toast((v === 'approve' ? t('approved') : t('rejected')) + (DEMO ? ' ' + t('demoNoTg') : '')); }
    catch (err) { toast(t('error', err.message || err), 6000); }
    await refresh();
  }
  else if (act === 'backup') {
    UI.busy.backup = true; render();
    try { await edge('backup'); UI.busy.backup = 'done'; await loadData(); render(); setTimeout(() => { UI.busy.backup = false; if (UI.admin) render(); }, 2500); }
    catch (err) { UI.busy.backup = false; toast(t('error', err.message || err), 6000); render(); }
  }
  else if (act === 'remind') {
    UI.busy.remind = true; render();
    try { await edge('remind'); toast(t('remSent') + (DEMO ? ' ' + t('demoNoTg') : '')); } catch (err) { toast(t('error', err.message || err), 6000); }
    UI.busy.remind = false; render();
  }
  else if (act === 'stop') openStop(memberById(Number(v)));
  else if (act === 'dlgClose') $('#dlg').close();
  else if (act === 'react') {
    const m = memberById(Number(v)), ob = openBreak(m); if (!ob) return;
    try {
      if (mi(ob.from_month) >= NOW()) await api.remove('member_breaks', ob.id);
      else await api.update('member_breaks', ob.id, { to_month: miDate(NOW() - 1) });
      toast(t('reactivated', m.name)); await refresh();
    } catch (err) { toast(t('error', err.message || err), 6000); }
  }
  else if (act === 'unlink') {
    const m = memberById(Number(v)); if (!confirm(t('confirmUnlink', m.name))) return;
    try { await api.update('members', m.id, { tg_chat_id: null }); await refresh(); } catch (err) { toast(t('error', err.message || err), 6000); }
  }
  else if (act === 'delMember') {
    const m = memberById(Number(v));
    if (S.cashIn.some((p) => p.member_id === m.id || p.sent_by === m.id)) return toast(t('cantDel'));
    if (!confirm(t('confirmDel', m.name))) return;
    try { await api.remove('members', m.id); await refresh(); } catch (err) { toast(t('error', err.message || err), 6000); }
  }
  else if (act === 'tpl') download('tabungfamily-import-template.csv', '﻿' + templateCSV(), 'text/csv;charset=utf-8');
  else if (act === 'impAgain') { UI.imp = null; UI.impDone = null; render(); }
  else if (act === 'doImport') { const o = $('#impOpen'); if (o) UI.imp.open = o.value; doImport(); }
  else if (act === 'seeYear') { e.preventDefault(); UI.year = Number(v); UI.impDone = null; location.hash = ''; }
});
document.addEventListener('change', async (e) => {
  const el = e.target;
  if (el.id === 'impFile' && el.files[0]) {
    try {
      const imp = await readImportFile(el.files[0]);
      imp.create = false; imp.skipDup = true; imp.open = S.settings.opening_balance ?? '0';
      markImport(imp); UI.imp = imp; UI.impDone = null; render();
    } catch (err) { toast(t('error', err.message || err), 6000); }
  }
  if (el.dataset?.act === 'impOpt') { const o = $('#impOpen'); if (o) UI.imp.open = o.value; UI.imp[el.dataset.v] = el.checked; render(); }
});
document.addEventListener('submit', async (e) => {
  const f = e.target; if (f.id === 'fStop' || f.method === 'dialog' && f.id === 'fStop') return;
  e.preventDefault();
  const btn = f.querySelector('[type=submit]'); if (btn) btn.disabled = true;
  try {
    if (f.id === 'loginForm') {
      if (DEMO) { UI.adminOk = true; return render(); }
      const { error } = await sb.auth.signInWithPassword({ email: $('#lgE').value.trim(), password: $('#lgP').value });
      if (error) return renderLogin(error.message);
      const { data: ok } = await sb.rpc('is_admin');
      if (!ok) { await sb.auth.signOut(); return renderLogin(t('notAdmin')); }
      UI.adminOk = true; await refresh();
    } else if (f.id === 'fIn') {
      const amount = Number($('#iA').value), member_id = Number($('#iM').value) || null, paid_on = $('#iD').value, kind = $('#iK').value, fm = $('#iF').value;
      if (!(amount > 0) || !paid_on) throw new Error(t('badInput'));
      if (!member_id && kind !== 'sumbangan') throw new Error(t('otherNeedsSumb'));
      await api.insert('cash_in', { member_id, paid_on, amount, method: $('#iC').value, sent_by: member_id, source: 'manual', status: 'approved', kind, for_month: kind === 'yuran' && fm ? fm + '-01' : null });
      toast(t('saved')); await refresh();
    } else if (f.id === 'fOut') {
      const file = $('#oF').files[0], legacy = $('#oL').checked, amount = Number($('#oA').value), description = $('#oD').value.trim();
      const errEl = $('#oErr');
      if (!file && !legacy) { errEl.textContent = t('needReceipt'); errEl.hidden = false; return; }
      if (!(amount > 0) || !description) throw new Error(t('badInput'));
      let receipt_url = null;
      if (file) {
        toast(t('uploading'), 20000);
        const day = $('#oT').value;
        // Drive: Tabung Family / Cash Out / YYYY-MM-DD_Category_Item.ext
        const ext = (file.name.match(/\.[a-z0-9]{2,5}$/i) || [file.type === 'application/pdf' ? '.pdf' : '.jpg'])[0].toLowerCase();
        const catLabel = CAT.find((c) => c[0] === $('#oC').value)?.[1] || $('#oC').value;
        const r = await edge('upload', { name: `${day}_${catLabel}_${description}${ext}`, mime: file.type || 'application/octet-stream', data: DEMO ? '' : await fileB64(file), kind: 'out', public: true });
        receipt_url = DEMO ? URL.createObjectURL(file) : r.url;
      }
      await api.insert('cash_out', { spent_on: $('#oT').value, description, category: $('#oC').value, amount, receipt_url, legacy: !receipt_url, source: 'manual' });
      toast(t('saved')); await refresh();
    } else if (f.id === 'fMem') {
      const name = $('#nN').value.trim(), sm = $('#nS').value;
      if (!name || !sm) throw new Error(t('badInput'));
      await api.insert('members', { name, start_month: sm + '-01' });
      toast(t('saved')); await refresh();
    } else if (f.id === 'fSet') {
      await api.settings({ monthly_due: Number($('#sF').value) || 100, fund_name: $('#sN').value.trim() || 'TabungFamily', opening_balance: Number($('#sO').value) || 0 });
      toast(t('saved')); await refresh();
    }
  } catch (err) { toast(t('error', err.message || err), 6000); }
  finally { if (btn && document.contains(btn)) btn.disabled = false; }
});

/* ------------------------------------------------------------------ router */
function render() {
  UI.admin = location.hash === '#admin';
  renderHeader();
  if (!UI.admin) return renderPublic();
  if (!UI.adminOk) return renderLogin();
  renderAdmin();
}
let lastRoute = null;
window.addEventListener('hashchange', async () => {
  const wasAdmin = lastRoute === '#admin', isAdmin = location.hash === '#admin';
  lastRoute = isAdmin ? '#admin' : 'public';
  if (wasAdmin !== isAdmin) { window.scrollTo(0, 0); render(); }
  else renderHeader();
  if (!isAdmin) {
    const id = location.hash.slice(1), el = id && document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    else if (!id) window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});

(async function init() {
  lastRoute = location.hash === '#admin' ? '#admin' : 'public';
  try {
    if (!DEMO) {
      await loadScript(SUPABASE_JS);
      sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
      const { data: { session } } = await sb.auth.getSession();
      if (session) { const { data: ok } = await sb.rpc('is_admin'); UI.adminOk = !!ok; }
    }
    await loadData();
    render();
    const id = location.hash.slice(1), el = id && id !== 'admin' && document.getElementById(id);
    if (el) el.scrollIntoView();
  } catch (e) {
    renderHeader();
    $('#app').innerHTML = `<main class="wrap"><div class="card" style="margin-top:30px"><p class="err">${h(t('loadErr', e.message || e))}</p></div></main>`;
  }
})();
</script>
